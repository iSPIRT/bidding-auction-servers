// Simplified generate_bid proto for secure invoke
syntax = "proto3";

package privacy_sandbox.bidding_auction_servers;

message BrowserSignals {
  int32 join_count = 1;
  int32 bid_count = 2;
  string prev_wins = 3;
}

message InterestGroup {
  string name = 1;
  repeated string bidding_signals_keys = 2;
  string user_bidding_signals = 3;
  repeated string ad_render_ids = 4;
  BrowserSignals browser_signals = 5;
}

