[build-system]
requires = ["setuptools>=61.0", "wheel", "grpcio-tools>=1.54.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-invoke"
version = "1.0.0"
description = "Python SDK for secure invoke operations with BFE/SFE services"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Privacy Sandbox"}
]
keywords = ["hpke", "encryption", "bidding", "auction", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyhpke>=0.3.0",
    "requests>=2.31.0",
    "protobuf>=4.23.0",
    "grpcio>=1.54.0",
    "grpcio-tools>=1.54.0",
    "cryptography>=41.0.0",
]

[project.scripts]
secure-invoke = "secure_invoke.cli:main"

[project.urls]
Homepage = "https://github.com/privacysandbox/bidding-auction-servers"
Repository = "https://github.com/privacysandbox/bidding-auction-servers"

[tool.setuptools]
packages = ["secure_invoke", "secure_invoke.utils", "secure_invoke.protos"]
include-package-data = true

[tool.setuptools.package-data]
secure_invoke = ["protos/*.proto"]

