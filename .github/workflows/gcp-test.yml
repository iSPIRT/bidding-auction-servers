name: GCP Offer Services — test

permissions:
  contents: read

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    # Bazel + first cbuild image pull can be slow.
    timeout-minutes: 120
    env:
      GCP_DOMAIN: ${{ vars.GCP_DOMAIN }}
      GCP_BFE_HOST: ${{ vars.GCP_BFE_HOST }}
      OPERATOR: ispirt
      ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secure invoke (smoke test)
        run: |
          set -euo pipefail
          test -n "${GCP_DOMAIN}" || (echo "Set repository variable GCP_DOMAIN (apex, e.g. example.com)" && exit 1)
          test -f "${GITHUB_WORKSPACE}/get_bids_request.json" || (echo "Missing get_bids_request.json at repo root" && exit 1)
          chmod +x ./builders/tools/cbuild

          if [ -n "${GCP_BFE_HOST:-}" ]; then
            HOST_ADDR="${GCP_BFE_HOST}"
          else
            HOST_ADDR="${OPERATOR}-${ENV}.bfe.${GCP_DOMAIN}:443"
          fi
          echo "BFE host_addr=${HOST_ADDR}"
          echo "## secure_invoke smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "host_addr=\`${HOST_ADDR}\`" >> "$GITHUB_STEP_SUMMARY"

          ATTEMPTS=4
          SLEEP_BETWEEN=120
          for A in $(seq 1 "${ATTEMPTS}"); do
            echo "secure_invoke attempt ${A}/${ATTEMPTS}..."
            if ./builders/tools/cbuild \
              --image build-debian \
              --cmd "bazel run //tools/secure_invoke:invoke -- --target_service=BFE --input_file=/src/workspace/get_bids_request.json --host_addr=${HOST_ADDR} --client_type=CLIENT_TYPE_BROWSER --insecure=false --client_ip=192.168.1.1"; then
              echo "secure_invoke succeeded on attempt ${A}"
              echo "Succeeded on attempt **${A}**." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "${A}" -lt "${ATTEMPTS}" ]; then
              echo "secure_invoke failed; sleeping ${SLEEP_BETWEEN}s before retry..."
              sleep "${SLEEP_BETWEEN}"
            fi
          done
          echo "::error::secure_invoke failed after ${ATTEMPTS} attempts"
          exit 1
